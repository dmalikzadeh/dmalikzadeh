<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 344" width="372" height="344" role="img" aria-label="Most used languages: TypeScript 85.1%, Python 11.6%, CSS 2.6%, JavaScript 0.7%">
  <style>
    .ti { font: 700 11px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #C4532F; letter-spacing: 1.6px; }
    .nm { font: 500 12.5px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8D8078; }
    .pc { font: 400 11.5px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8D8078; }
    .tr { fill: #8D8078; fill-opacity: .28; }

    @media (prefers-color-scheme: light) {
      .nm { fill: #1F2328; }
      .pc { fill: #59636E; }
    }
    @media (prefers-color-scheme: dark) {
      .ti { fill: #F27554; }
      .nm { fill: #E6EDF3; }
      .pc { fill: #8D96A0; }
      .tr { fill-opacity: .22; }
    }
  </style>

  <text x="52" y="18" class="ti">MOST USED LANGUAGES</text>
  <g>
    <text x="52" y="59.0" class="nm">TypeScript</text>
    <rect x="52" y="68.0" width="258" height="4" rx="2" class="tr"/>
    <rect x="52" y="68.0" width="219.5" height="4" rx="2" fill="#e8613c"/>
    <text x="372" y="72.0" class="pc" text-anchor="end">85.07%</text>
  </g>
  <g>
    <text x="52" y="107.0" class="nm">Python</text>
    <rect x="52" y="116.0" width="258" height="4" rx="2" class="tr"/>
    <rect x="52" y="116.0" width="30.0" height="4" rx="2" fill="#f27554"/>
    <text x="372" y="120.0" class="pc" text-anchor="end">11.61%</text>
  </g>
  <g>
    <text x="52" y="155.0" class="nm">CSS</text>
    <rect x="52" y="164.0" width="258" height="4" rx="2" class="tr"/>
    <rect x="52" y="164.0" width="6.7" height="4" rx="2" fill="#f4978e"/>
    <text x="372" y="168.0" class="pc" text-anchor="end">2.58%</text>
  </g>
  <g>
    <text x="52" y="203.0" class="nm">JavaScript</text>
    <rect x="52" y="212.0" width="258" height="4" rx="2" class="tr"/>
    <rect x="52" y="212.0" width="4.0" height="4" rx="2" fill="#f8ad9d"/>
    <text x="372" y="216.0" class="pc" text-anchor="end">0.74%</text>
  </g>
</svg>
